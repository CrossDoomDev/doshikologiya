<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
<title id="t">Дошикология</title><desc id="d">Живая чашка лапши — талисман Института дошикологии</desc>
<defs>
  <linearGradient id="bg" x1="70" y1="30" x2="442" y2="482" gradientUnits="userSpaceOnUse">
    <stop stop-color="#38200d"/><stop offset=".55" stop-color="#1b1009"/><stop offset="1" stop-color="#100a07"/>
  </linearGradient>
  <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(256 245) rotate(90) scale(205)" gradientUnits="userSpaceOnUse">
    <stop stop-color="#ffb229" stop-opacity=".34"/><stop offset=".72" stop-color="#ff7a18" stop-opacity=".08"/><stop offset="1" stop-color="#ff7a18" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="cup" x1="156" y1="186" x2="351" y2="410" gradientUnits="userSpaceOnUse">
    <stop stop-color="#fff8e9"/><stop offset=".68" stop-color="#ffe7bd"/><stop offset="1" stop-color="#ffc56b"/>
  </linearGradient>
  <linearGradient id="orange" x1="180" y1="200" x2="338" y2="404" gradientUnits="userSpaceOnUse">
    <stop stop-color="#ffb229"/><stop offset=".55" stop-color="#ff7a18"/><stop offset="1" stop-color="#e84d0a"/>
  </linearGradient>
  <linearGradient id="noodle" x1="190" y1="143" x2="330" y2="213" gradientUnits="userSpaceOnUse">
    <stop stop-color="#ffd45c"/><stop offset=".55" stop-color="#ffad18"/><stop offset="1" stop-color="#e96c08"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".42"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
</defs>

<rect x="10" y="10" width="492" height="492" rx="112" fill="url(#bg)" stroke="#754314" stroke-width="6"/>
