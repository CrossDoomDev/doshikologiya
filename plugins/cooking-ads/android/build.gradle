apply plugin: 'com.android.library'

android {
    namespace 'ru.doshikologiya.cookingads'
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        def demo = project.findProperty('doshikAdsDemo') == 'true'
        buildConfigField 'String', 'BANNER_AD_UNIT_ID', '"' + (demo ? 'demo-banner-yandex' : 'R-M-20184115-1') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:${rootProject.ext.androidxAppCompatVersion}"
    implementation 'com.yandex.android:mobileads:8.5.0'
    testImplementation 'junit:junit:4.13.2'
}
