name: Дошикология — signed release APK

on:
  workflow_dispatch:
  push:
    branches: [main, feature/yandex-cooking-banner]
    paths:
      - '.github/workflows/android-release.yml'
      - 'privacy.html'
      - 'terms.html'
      - 'js/features/ads.js'
      - 'scripts/install-yandex-ads.mjs'
      - 'data/config.json'
      - 'index.html'
      - 'js/main.js'
      - 'css/styles.css'
      - 'css/legal.css'
      - 'tests/ads-bridge.test.mjs'
      - 'native/android/DoshikAdsPlugin.java'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Ensure release signing secrets exist
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
      - name: Install dependencies and validate data
        run: |
          npm install --no-audit --no-fund
          node scripts/validate-data.mjs
          npm run android:prepare
          npx cap add android
          npx cap sync android
          npm run android:icons
          npm run android:ads
      - name: Restore signing keystore and configure release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-upload.jks
          chmod 600 android/app/release-upload.jks
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          assert 'android {' in s and 'buildTypes {' in s and 'release {' in s, 'Unexpected Capacitor Gradle template'
          s=s.replace('android {', """android {
              signingConfigs {
                  release {
                      storeFile file('release-upload.jks')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
          """,1)
          # Modify the release build type, not the signingConfigs.release block.
          pos=s.index('buildTypes {')
          s=s[:pos]+s[pos:].replace('release {','release {\n            signingConfig signingConfigs.release',1)
          p.write_text(s)
          PY
      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"
      - name: Confirm production ID and release package
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          apk = 'android/app/build/outputs/apk/release/app-release.apk'
          with ZipFile(apk) as z:
              manifest = z.read('AndroidManifest.xml')
              assert 'ru.doshikologiya.app'.encode('utf-16le') in manifest
              assert 'ru.doshikologiya.app.demo'.encode('utf-16le') not in manifest
              assert '1.1.6'.encode('utf-16le') in manifest
              dex = b''.join(z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex'))
              assert b'R-M-20184115-1' in dex
          print("Signed production APK contains correct package, version, and live ad unit")
          PY
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doshikologiya-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
