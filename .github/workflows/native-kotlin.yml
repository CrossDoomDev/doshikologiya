name: Doshikologiya Kotlin Preview

on:
  workflow_dispatch:
  push:
    branches: [feature/native-kotlin]
    paths: ['native-android/**', '.github/workflows/native-kotlin.yml', 'data/**', 'images/**', 'tests/**']
  pull_request:
    branches: [feature/native-kotlin]
    paths: ['native-android/**', '.github/workflows/native-kotlin.yml', 'data/**', 'images/**', 'tests/**']

permissions:
  contents: read

jobs:
  kotlin-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate shared content and Capacitor behavior
        run: |
          node scripts/validate-data.mjs
          node --test tests/*.test.mjs
      - name: Test native behavior, render phone screens, lint and build
        working-directory: native-android
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK assets and native independence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apk=Path('native-android/app/build/outputs/apk/debug/app-debug.apk')
          with ZipFile(apk) as z:
              assert 'assets/recipes.json' in z.namelist()
              assert 'assets/recipes-index.json' in z.namelist()
          sources=Path('native-android/app/src/main/java')
          for file in sources.rglob('*.kt'):
              text=file.read_text()
              assert 'android.webkit.WebView' not in text
              # Yandex ads are only allowed in the isolated native cooking slot.
              if file.name == 'CookingAdBanner.kt':
                  assert 'com.yandex.mobile.ads' in text
              else:
                  assert 'com.yandex.mobile.ads' not in text
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-parity-reports
          path: |
            native-android/app/build/reports/
            native-android/app/build/parity-screenshots/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: doshikologiya-kotlin-preview-debug
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
