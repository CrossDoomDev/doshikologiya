name: Проверка рецептов и текстов

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# When several commits are pushed rapidly, only validate the newest revision.
# Older queued/running checks are superseded, reducing obsolete failures.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate-data.mjs
      - run: node --test tests/*.test.mjs
