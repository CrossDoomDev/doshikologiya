name: Android signed APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android platforms and tools
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare offline web assets
        run: npm run android:prepare

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Android assets
        run: npx cap sync android

      - name: Generate branded Android launcher icons
        run: |
          npm run android:icons
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Set release version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          content = p.read_text()
          content, c = re.subn(r'versionCode\s+\d+', 'versionCode 1', content, count=1)
          if c != 1: raise SystemExit("Android versionCode not found")
          content, c = re.subn(r'versionName\s+["\'][^"\']+["\']', 'versionName "1.0.0"', content, count=1)
          if c != 1: raise SystemExit("Android versionName not found")
          p.write_text(content)
          PY

      - name: Assemble unsigned release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Sign release APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing required signing secret: $name"; exit 1; fi
          done
          mkdir -p "$RUNNER_TEMP/signing" dist
          chmod 700 "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"
          chmod 600 "$RUNNER_TEMP/signing/release.jks"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" dist/doshikologiya-1.0.0-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/signing/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out dist/doshikologiya-1.0.0-release.apk \
            dist/doshikologiya-1.0.0-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs dist/doshikologiya-1.0.0-release.apk
          rm -f dist/doshikologiya-1.0.0-aligned.apk
          rm -f "$RUNNER_TEMP/signing/release.jks"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: doshikologiya-1.0.0-signed-apk
          path: dist/doshikologiya-1.0.0-release.apk
          if-no-files-found: error
          retention-days: 14
