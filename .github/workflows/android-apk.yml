name: Дошикология — Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -n 8

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Validate and package offline web assets
        run: |
          node scripts/validate-data.mjs
          npm run android:prepare
          test -f www/data/recipes.json
          test -f www/images/recipes/carbonara-2049.webp

      - name: Generate Android Gradle project
        run: npx cap add android

      - name: Synchronize Android assets
        run: npx cap sync android

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: doshikologiya-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
