name: Дошикология — Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['plugins/**', 'js/**', 'css/**', 'index.html', 'package*.json', '.github/workflows/android-apk.yml']

permissions:
  contents: read

jobs:
  build-debug:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -n 8

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Validate and package offline web assets
        run: |
          node scripts/validate-data.mjs
          node --test tests/*.test.mjs
          npm run android:prepare
          test -f www/data/recipes.json
          test -f www/images/recipes/carbonara-2049.webp

      - name: Generate Android Gradle project
        run: npx cap add android

      - name: Synchronize Android assets
        run: npx cap sync android

      - name: Generate branded Android launcher icons
        run: |
          npm run android:icons
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :doshikologiya-cooking-ads:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: doshikologiya-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Compile SDK demo-banner APK
        working-directory: android
        run: ./gradlew :app:assembleDebug -PdoshikAdsDemo=true --no-daemon

      - name: Upload SDK demo-banner APK
        uses: actions/upload-artifact@v4
        with:
          name: doshikologiya-demo-banner-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacitor-ad-reports
          path: |
            android/app/build/reports/
            plugins/cooking-ads/android/build/reports/
          if-no-files-found: warn
          retention-days: 7
