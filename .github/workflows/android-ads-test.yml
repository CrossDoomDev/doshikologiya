name: Test Yandex Ads Android integration

on:
  push:
    branches: ['feature/yandex-cooking-banner']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-ads-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate catalog and prepare Android
        run: |
          npm install --no-audit --no-fund
          node scripts/validate-data.mjs
          npm run android:prepare
          npx cap add android
          npx cap sync android
          npm run android:icons
          npm run android:ads
      - name: Build debug APK with Yandex DEMO banner
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: doshikologiya-yandex-ads-debug-demo
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
