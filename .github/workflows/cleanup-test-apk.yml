name: Временная очистка APK-артефактов

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-test-apk.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Удалить устаревшие тестовые APK
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete Android debug APK artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner, repo, per_page: 100
            });
            const targets = artifacts.filter(a => a.name === 'doshikologiya-debug-apk');
            for (const artifact of targets) {
              await github.rest.actions.deleteArtifact({owner, repo, artifact_id: artifact.id});
              core.info('Deleted debug APK artifact: ' + artifact.id);
            }
            core.info('Deleted ' + targets.length + ' Android debug APK artifact(s)');
