name: Дошикология Kotlin — signed RuStore APK

on:
  workflow_dispatch:
  push:
    branches: [release/kotlin-rustore-ads]
    paths:
      - 'native-android/**'
      - '.github/workflows/kotlin-rustore-release.yml'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > native-android/app/release-upload.jks
          chmod 600 native-android/app/release-upload.jks
      - name: Configure signing without committing credentials
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("native-android/app/build.gradle.kts")
          s = p.read_text()
          assert 'buildTypes { release { isMinifyEnabled = false } }' in s
          s = s.replace('buildTypes { release { isMinifyEnabled = false } }', """
              signingConfigs {
                  create("rustoreRelease") {
                      storeFile = file("release-upload.jks")
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("rustoreRelease")
                  }
              }
          """)
          p.write_text(s)
          PY
      - name: Build Kotlin signed release
        working-directory: native-android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK package and signing
        run: |
          APK=native-android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging "$APK" | grep "^package: name='ru.doshikologiya.app'"
      - name: Upload signed Kotlin APK
        uses: actions/upload-artifact@v4
        with:
          name: doshikologiya-kotlin-rustore-signed-release
          path: native-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
