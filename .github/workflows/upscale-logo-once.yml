name: Upscale Doshikologiya logo once

on:
  push:
    paths:
      - ".github/workflows/upscale-logo-once.yml"

permissions:
  contents: write

jobs:
  upscale-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Rebuild logo at 768px
        shell: python
        run: |
          import base64
          import io
          import re
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageFilter

          path = Path("images/ui/doshikologiya-mark.svg")
          svg = path.read_text(encoding="utf-8")
          match = re.search(r'data:image/webp;base64,([^"]+)', svg)
          if not match:
              raise SystemExit("Embedded WebP was not found")

          source = Image.open(io.BytesIO(base64.b64decode(match.group(1)))).convert("RGBA")
          source = source.resize((768, 768), Image.Resampling.LANCZOS)

          r, g, b, a = source.split()
          rgb = Image.merge("RGB", (r, g, b))
          rgb = ImageEnhance.Contrast(rgb).enhance(1.10)
          rgb = ImageEnhance.Color(rgb).enhance(1.05)
          rgb = rgb.filter(ImageFilter.UnsharpMask(radius=1.0, percent=105, threshold=2))
          result = Image.merge("RGBA", (*rgb.split(), a))

          out = io.BytesIO()
          result.save(out, format="WEBP", quality=96, method=6)
          encoded = base64.b64encode(out.getvalue()).decode("ascii")

          rebuilt = f'''<svg xmlns="http://www.w3.org/2000/svg" width="768" height="768" viewBox="0 0 768 768">
            <image width="768" height="768" preserveAspectRatio="xMidYMid meet" href="data:image/webp;base64,{encoded}"/>
          </svg>
          '''
          path.write_text(rebuilt, encoding="utf-8")

          check = Image.open(io.BytesIO(out.getvalue()))
          if check.size != (768, 768):
              raise SystemExit(f"Unexpected output size: {check.size}")
          print(f"Logo rebuilt: {check.size[0]}x{check.size[1]}, {len(out.getvalue())} bytes")

      - name: Commit regenerated logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/ui/doshikologiya-mark.svg
          if git diff --cached --quiet; then
            echo "No logo changes to commit"
          else
            git commit -m "Regenerate Doshikologiya logo at 768px"
            git push
          fi
